<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Açı Atölyesi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Lexend:wght@400;500;600&display=swap">
<style>
/* Düzen: solda sade araç menüsü, sağda kareli gri-mavi çizim düzlemi. Tek, açık sınıf teması. */
:root{
  --board:#e3eaf2;      /* çizim düzlemi: hafif gri-mavi */
  --grid:#d3dde8;
  --panel:#f7f9fc;
  --ink:#24324a;        /* çizgiler ve yazı */
  --muted:#6a7891;
  --accent:#2f6fd0;     /* seçili araç, açıölçer */
  --accent-soft:#dde8f8;
  --danger:#d2483a;
  --line:#cfd8e4;
  --f-display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Lexend","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0}
body{background:var(--panel);color:var(--ink);font-family:var(--f-body);font-size:14px;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.app{display:flex;height:100%;
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);box-sizing:border-box}
.side{width:212px;flex:none;display:flex;flex-direction:column;gap:10px;padding:14px 12px;box-sizing:border-box;border-right:1px solid var(--line);background:var(--panel);overflow-y:auto}
.brand{font-family:var(--f-display);font-weight:600;font-size:22px;line-height:1.1;padding:2px 6px 4px;display:flex;align-items:center;gap:8px}
.brand svg{flex:none}
.grp{display:flex;flex-direction:column;gap:3px}
.grp h2{margin:0;padding:0 6px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.btn{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:6px 10px;border:1.5px solid transparent;border-radius:10px;background:transparent;color:var(--ink);font:500 15px var(--f-body);text-align:left;cursor:pointer}
.btn svg{flex:none;width:26px;height:26px}
.btn:hover{background:#eaf0f7}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:#16407f}
.btn.warn{color:var(--danger)}
.btn.armed{background:#fbe3df;border-color:var(--danger)}
.sp{flex:1}
.ver{font-size:11px;color:var(--muted);padding:0 8px}
.stage{position:relative;flex:1;min-width:0;background:var(--board)}
#cv{position:absolute;inset:0;touch-action:none;display:block}
.hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);max-width:calc(100% - 32px);box-sizing:border-box;background:rgba(255,255,255,.88);border:1px solid var(--line);border-radius:999px;padding:7px 16px;font-size:13.5px;color:var(--ink);pointer-events:none;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);text-align:center}
.toast a{color:#bcd6ff}
.rename{position:absolute;width:64px;height:34px;box-sizing:border-box;padding:0 8px;border:2px solid var(--accent);border-radius:9px;background:#fff;color:var(--ink);font:600 17px var(--f-display);text-align:center;outline:none;box-shadow:0 4px 14px rgba(36,50,74,.18);user-select:text;-webkit-user-select:text}
.zoom{position:absolute;left:12px;bottom:12px;display:flex;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.zoom button{min-width:44px;height:40px;border:0;background:transparent;color:var(--ink);font:600 18px var(--f-body);cursor:pointer}
.zoom button#z-reset{font-size:13px;min-width:58px;border-left:1px solid var(--line);border-right:1px solid var(--line);font-variant-numeric:tabular-nums}
.zoom button:hover{background:#eaf0f7}
.zoom button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.sig{position:fixed;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(8px + env(safe-area-inset-bottom,0px));font:600 12px var(--f-display);color:var(--ink);opacity:.45;pointer-events:none;z-index:50}
@media (max-width:720px){
  .app{flex-direction:column}
  .side{width:auto;flex-direction:row;align-items:center;gap:6px;padding:8px max(12px,env(safe-area-inset-left,0px));border-right:0;border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden}
  .brand,.grp h2,.sp,.ver{display:none}
  .grp{flex-direction:row;gap:4px;padding-right:6px;border-right:1px solid var(--line)}
  .grp:last-of-type{border-right:0}
  .btn{width:auto;white-space:nowrap;min-height:42px;padding:6px 10px;font-size:13.5px}
  .btn svg{width:22px;height:22px}
  .hint{white-space:normal;border-radius:12px}
}
</style>
</head>
<body>
<div class="app">
  <nav class="side" aria-label="Araçlar">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><path d="M4 25 L27 25" stroke="#24324a" stroke-width="2.6" stroke-linecap="round"/><path d="M4 25 L22 6" stroke="#24324a" stroke-width="2.6" stroke-linecap="round"/><path d="M13 25 A9 9 0 0 0 10.2 18.4" fill="none" stroke="#e4572e" stroke-width="2.6"/><circle cx="4" cy="25" r="2.6" fill="#2f6fd0"/></svg>
      Açı Atölyesi
    </div>

    <div class="grp">
      <h2>Çiz</h2>
      <button class="btn" id="t-ray" data-tool="ray"><svg viewBox="0 0 26 26"><circle cx="4" cy="20" r="2.6" fill="currentColor"/><path d="M4 20 L23 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M23 6 l-6.2 .8 M23 6 l-2.6 5.6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>Işın</button>
      <button class="btn" id="t-seg" data-tool="seg"><svg viewBox="0 0 26 26"><path d="M4 20 L22 6" stroke="currentColor" stroke-width="2.2"/><circle cx="4" cy="20" r="2.6" fill="currentColor"/><circle cx="22" cy="6" r="2.6" fill="currentColor"/></svg>Doğru Parçası</button>
      <button class="btn" id="t-line" data-tool="line"><svg viewBox="0 0 26 26"><path d="M3 21 L23 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M23 5 l-6.2 .8 M23 5 l-2.6 5.6 M3 21 l6.2 -.8 M3 21 l2.6 -5.6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="9.5" cy="15.8" r="2.2" fill="currentColor"/><circle cx="16.5" cy="10.2" r="2.2" fill="currentColor"/></svg>Doğru</button>
      <button class="btn" id="t-circ" data-tool="circ"><svg viewBox="0 0 26 26"><circle cx="13" cy="13" r="9.5" stroke="currentColor" stroke-width="2.2" fill="none"/><path d="M13 13 L21 8" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2.2 2"/><circle cx="13" cy="13" r="2.4" fill="currentColor"/></svg>Çember</button>
      <button class="btn" id="t-perp" data-tool="perp"><svg viewBox="0 0 26 26"><path d="M3 21 H23 M13 21 V4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M13 16 H18 V21" stroke="currentColor" stroke-width="1.6" fill="none"/><circle cx="13" cy="4" r="2.4" fill="currentColor"/></svg>Dikme</button>
      <button class="btn" id="t-par" data-tool="par"><svg viewBox="0 0 26 26"><path d="M3 12 L18 4 M8 22 L23 14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M9.5 7.6 l1.6 2.6 M14.5 17.6 l1.6 2.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>Paralel</button>
      <button class="btn" id="t-int" data-tool="int"><svg viewBox="0 0 26 26"><path d="M3 20 L23 6 M4 6 L22 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="13" cy="13" r="3.6" fill="#fff" stroke="currentColor" stroke-width="2.2"/></svg>Kesiştir</button>
    </div>

    <div class="grp">
      <h2>Düzenle</h2>
      <button class="btn" id="t-move" data-tool="move"><svg viewBox="0 0 26 26"><path d="M13 3 v20 M3 13 h20 M13 3 l-3 3 M13 3 l3 3 M13 23 l-3 -3 M13 23 l3 -3 M3 13 l3 -3 M3 13 l3 3 M23 13 l-3 -3 M23 13 l-3 3" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>Taşı</button>
      <button class="btn" id="t-del" data-tool="del"><svg viewBox="0 0 26 26"><path d="M5 8 h16 M10 8 V5 h6 v3 M7 8 l1.2 14 h9.6 L19 8" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round"/></svg>Sil</button>
      <button class="btn" id="b-undo"><svg viewBox="0 0 26 26"><path d="M9 6 L4 11 L9 16" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 11 h11 a6 6 0 0 1 0 12 h-4" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>Geri Al</button>
      <button class="btn warn" id="b-clear"><svg viewBox="0 0 26 26"><path d="M6 6 L20 20 M20 6 L6 20" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg><span>Temizle</span></button>
    </div>

    <div class="grp">
      <h2>Göster</h2>
      <button class="btn" id="b-deg"><svg viewBox="0 0 26 26"><path d="M2.5 13 C6 7 20 7 23.5 13 C20 19 6 19 2.5 13 Z" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="13" cy="13" r="3.4" fill="currentColor"/><path id="deg-slash" d="M4 22 L22 4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" opacity="0"/></svg><span>Dereceleri Gizle</span></button>
      <button class="btn" id="b-prot"><svg viewBox="0 0 26 26"><path d="M2 20 A11 11 0 0 1 24 20 Z" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round"/><path d="M13 20 V12 M6 13.5 l1.6 1.4 M20 13.5 l-1.6 1.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="13" cy="20" r="1.6" fill="currentColor"/></svg><span>Açıölçer</span></button>
    </div>

    <div class="sp"></div>
    <div class="grp">
      <button class="btn" id="b-update"><span style="font-size:20px;width:26px;text-align:center">🔄</span>Güncelle</button>
      <div class="ver" id="ver"></div>
    </div>
  </nav>

  <main class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="hint" id="hint"></div>
    <div class="toast" id="toast" hidden></div>
    <input id="rename" class="rename" type="text" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Nokta adı" hidden>
    <div class="zoom" role="group" aria-label="Yakınlaştırma">
      <button id="z-out" aria-label="Uzaklaştır">−</button>
      <button id="z-reset" aria-label="Görünümü sıfırla">100%</button>
      <button id="z-in" aria-label="Yakınlaştır">+</button>
    </div>
  </main>
</div>
<div class="sig">Made by Us</div>

<script>
const APP_VERSION = '1.4.1';
const PAGES_URL = 'https://ekerem.github.io/aci-atolyesi/';
document.getElementById('ver').textContent = 'Sürüm ' + APP_VERSION;

if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r){ r = Math.min(r, w / 2, h / 2);
    this.moveTo(x + r, y); this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r); this.closePath(); };
}
/* ---------- Durum ---------- */
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const stage = document.getElementById('stage');
let W = 0, H = 0, DPR = 1;
let tool = 'ray';
let shapes = [];          // {type:'ray'|'seg'|'line', a:pt, b:pt}
let letterIdx = 0;
let showDeg = true;
const prot = { on:false, x:0, y:0, r:170, rot:0 };
const view = { s:1, ox:0, oy:0 };   // ekran = dünya * s + o
let drag = null, hover = null, history = [];
const LETTERS = 'ABCDEFGHKLMNPRSTUVYZ';
const PALETTE = ['#e4572e','#2f6fd0','#14a37f','#e89a0c','#8e44ad','#d81b60','#0e8fa3','#7a8c1c','#c0581f','#5b5fc7'];
const HINTS = {
  ray:  'Işın: başlangıç noktasından basılı tutup sürükleyin.',
  seg:  'Doğru parçası: bir uçtan diğer uca sürükleyin.',
  line: 'Doğru: iki noktası arasında sürükleyin, iki yönde sonsuza uzar.',
  circ: 'Çember: merkezden basılı tutup dışarı doğru sürükleyin; bıraktığınız yer çemberin üzerindedir.',
  move: 'Taşı: noktayı ya da çizgiyi sürükleyin. Adını değiştirmek için noktaya ya da harfine dokunun.',
  int:  'Kesiştir: bir kesişim yerine dokunun ya da sırayla iki şekle dokunun; kesişim noktası adlandırılır.',
  int2: 'Şimdi kesiştiği ikinci şekle dokunun.',
  del:  'Sil: silmek istediğiniz çizgiye dokunun.',
  perp: 'Dikme: önce bir çizgiye dokunun, sonra dikmenin çıkacağı noktaya dokunun.',
  par:  'Paralel: önce bir çizgiye dokunun, sonra paralelinin geçeceği yere dokunun.',
  place:'Şimdi yerleştirmek istediğiniz yere dokunun. Vazgeçmek için aracı yeniden seçin.'
};
let refShape = null, ghostAt = null;
let marks = [];   // kesişim noktaları: { pt, s1, s2 } — şekiller hareket edince birlikte hareket eder

function usedNames(){ return new Set(allPoints().map(p => p.name)); }
function newPoint(x, y){
  const used = usedNames(); let n;
  do { const i = letterIdx++; n = LETTERS[i % LETTERS.length] + (i >= LETTERS.length ? Math.floor(i / LETTERS.length) : ''); } while (used.has(n));
  return { x, y, name:n };
}

/* ---------- Geri al ---------- */
function snapshot(){
  const pts = [], idx = new Map();
  const add = p => { if (!idx.has(p)) { idx.set(p, pts.length); pts.push({ x:p.x, y:p.y, name:p.name, dep:!!p.dep }); } };
  for (const s of shapes) { add(s.a); add(s.b); }
  for (const m of marks) add(m.pt);
  return JSON.stringify({ pts, sh: shapes.map(s => [s.type, idx.get(s.a), idx.get(s.b)]),
    mk: marks.map(m => [idx.get(m.pt), shapes.indexOf(m.s1), shapes.indexOf(m.s2)]), letterIdx });
}
function pushHist(){ history.push(snapshot()); if (history.length > 60) history.shift(); }
function undo(){
  if (!history.length) return;
  refShape = null;
  const d = JSON.parse(history.pop());
  const pts = d.pts.map(p => ({...p}));
  shapes = d.sh.map(([type, a, b]) => ({ type, a:pts[a], b:pts[b] }));
  marks = (d.mk || []).map(([p, a, b]) => ({ pt:pts[p], s1:shapes[a], s2:shapes[b] }));
  letterIdx = d.letterIdx; draw();
}

/* ---------- Geometri ---------- */
const sub = (p, q) => ({ x:p.x - q.x, y:p.y - q.y });
const cross = (p, q) => p.x * q.y - p.y * q.x;
const dot = (p, q) => p.x * q.x + p.y * q.y;
const dist = (p, q) => Math.hypot(p.x - q.x, p.y - q.y);

const isCirc = s => s.type === 'circ';
const radius = c => dist(c.a, c.b);
function tRange(s){ const L = dist(s.a, s.b) || 1, e = 1.5 / L;
  return s.type === 'seg' ? [-e, 1 + e] : s.type === 'ray' ? [-e, Infinity] : [-Infinity, Infinity]; }
function distToShape(p, s){
  if (isCirc(s)) return Math.abs(dist(p, s.a) - radius(s));
  const d = sub(s.b, s.a), L2 = dot(d, d) || 1;
  let t = dot(sub(p, s.a), d) / L2;
  if (s.type === 'seg') t = Math.max(0, Math.min(1, t)); else if (s.type === 'ray') t = Math.max(0, t);
  return dist(p, { x:s.a.x + d.x * t, y:s.a.y + d.y * t });
}
function intersect(s1, s2){
  if (isCirc(s1) || isCirc(s2)) return null;
  const d1 = sub(s1.b, s1.a), d2 = sub(s2.b, s2.a), den = cross(d1, d2);
  if (Math.abs(den) < 1e-6 * Math.hypot(d1.x, d1.y) * Math.hypot(d2.x, d2.y)) return null;
  const w = sub(s2.a, s1.a), t = cross(w, d2) / den, u = cross(w, d1) / den;
  const r1 = tRange(s1), r2 = tRange(s2);
  if (t < r1[0] || t > r1[1] || u < r2[0] || u > r2[1]) return null;
  return { x:s1.a.x + d1.x * t, y:s1.a.y + d1.y * t, t, u };
}
/* Çemberle kesişimler: doğru-çember ve çember-çember */
function lineCircle(s, c){
  const d = sub(s.b, s.a), f = sub(s.a, c.a), A = dot(d, d), B = 2 * dot(f, d), C = dot(f, f) - radius(c) ** 2;
  const D = B * B - 4 * A * C; if (A < 1e-9 || D < 0) return [];
  const r = tRange(s), out = [];
  for (const t of D < 1e-9 ? [-B / (2 * A)] : [(-B - Math.sqrt(D)) / (2 * A), (-B + Math.sqrt(D)) / (2 * A)])
    if (t >= r[0] && t <= r[1]) out.push({ x:s.a.x + d.x * t, y:s.a.y + d.y * t, t });
  return out;
}
function circleCircle(c1, c2){
  const r1 = radius(c1), r2 = radius(c2), d = dist(c1.a, c2.a);
  if (d < 1e-6 || d > r1 + r2 + 1e-6 || d < Math.abs(r1 - r2) - 1e-6) return [];
  const a = (r1 * r1 - r2 * r2 + d * d) / (2 * d), h = Math.sqrt(Math.max(0, r1 * r1 - a * a));
  const ux = (c2.a.x - c1.a.x) / d, uy = (c2.a.y - c1.a.y) / d, mx = c1.a.x + ux * a, my = c1.a.y + uy * a;
  return h < 1e-6 ? [{ x:mx, y:my }] : [{ x:mx - uy * h, y:my + ux * h }, { x:mx + uy * h, y:my - ux * h }];
}
function circleHits(){
  const out = [];
  for (let i = 0; i < shapes.length; i++) for (let j = i + 1; j < shapes.length; j++) {
    const A = shapes[i], B = shapes[j];
    if (isCirc(A) && isCirc(B)) out.push(...circleCircle(A, B));
    else if (isCirc(A)) out.push(...lineCircle(B, A));
    else if (isCirc(B)) out.push(...lineCircle(A, B));
  }
  return out;
}
function pairHits(A, B){
  if (isCirc(A) && isCirc(B)) return circleCircle(A, B);
  if (isCirc(A)) return lineCircle(B, A);
  if (isCirc(B)) return lineCircle(A, B);
  const p = intersect(A, B); return p ? [p] : [];
}
/* Kesişim noktalarını şekillerle birlikte güncelle; şekli silinen kesişimi serbest nokta yap ya da kaldır */
function updateMarks(){
  const used = new Set(); for (const s of shapes) { used.add(s.a); used.add(s.b); }
  marks = marks.filter(m => {
    if (shapes.includes(m.s1) && shapes.includes(m.s2)) return true;
    m.pt.dep = false; m.pt.gone = false; return false;
  });
  for (const m of marks) {
    const hs = pairHits(m.s1, m.s2);
    if (!hs.length) { m.pt.gone = true; continue; }
    let best = hs[0]; for (const h of hs) if (dist(h, m.pt) < dist(best, m.pt)) best = h;
    m.pt.x = best.x; m.pt.y = best.y; m.pt.gone = false;
  }
}
/* Işın ve doğrular tanımlayan noktalarını ve kesişimlerini kapsayacak kadar çizilir, ucunda ok olur */
function extents(){
  const m = new Map();
  for (const s of shapes) m.set(s, [0, 1]);
  for (let i = 0; i < shapes.length; i++) for (let j = i + 1; j < shapes.length; j++) {
    const p = intersect(shapes[i], shapes[j]); if (!p) continue;
    const r1 = m.get(shapes[i]), r2 = m.get(shapes[j]);
    r1[0] = Math.min(r1[0], p.t); r1[1] = Math.max(r1[1], p.t);
    r2[0] = Math.min(r2[0], p.u); r2[1] = Math.max(r2[1], p.u);
  }
  for (const s of shapes) if (!isCirc(s)) for (const c of shapes) if (isCirc(c))
    for (const p of lineCircle(s, c)) { const r = m.get(s); r[0] = Math.min(r[0], p.t); r[1] = Math.max(r[1], p.t); }
  return m;
}
const ARROW_GAP = 42;
function visEnds(s, ext){
  if (s.type === 'seg') return [s.a, s.b];
  const d = sub(s.b, s.a), L = Math.hypot(d.x, d.y) || 1, r = (ext && ext.get(s)) || [0, 1], m = ARROW_GAP / L;
  const t0 = s.type === 'line' ? Math.min(0, r[0]) - m : 0, t1 = Math.max(1, r[1]) + m;

/* ---------- İşaretçi olayları ---------- */

/* ---------- Yakınlaştırma ---------- */
const zLabel = document.getElementById('z-reset');

cv.addEventListener('wheel', e => {

zLabel.addEventListener('click', () => { view.s = 1; view.ox = 0; view.oy = 0; zLabel.textContent = '100%'; draw(); });

cv.addEventListener('pointerdown', e => {

    if (!refShape) { refShape = s; hintEl.textContent = HINTS.int2; draw(); return; }
    if (s === refShape) return;
    const hs = pairHits(refShape, s);
    if (!hs.length) toast('Bu iki şekil kesişmiyor.');
    else { pushHist(); const names = hs.map(h => esc(addMark(h.x, h.y, refShape, s).name)); toast(names.join(' ve ') + (names.length > 1 ? ' kesişim noktaları' : ' kesişim noktası') + ' eklendi'); }
    refShape = null; hintEl.textContent = HINTS.int; draw(); return;
  }
  if (tool === 'del') {
    const s = hitShape(p, r);
    if (s) { pushHist(); shapes = shapes.filter(x => x !== s); hover = null; draw(); }
    return;
  }
  const sp = snap(p, r);
  drag = { kind:'draw', type:tool, a:sp.pt || { x:sp.x, y:sp.y }, aExisting:!!sp.pt, b:{ x:p.x, y:p.y }, liveDeg:null };
  draw();
});

cv.addEventListener('pointermove', e => {
  if (touches.has(e.pointerId)) touches.set(e.pointerId, spos(e));
  if (pinch) { if (touches.size >= 2) doPinch(); return; }
  if (drag && drag.kind === 'pan') { const q = spos(e); view.ox += q.x - drag.last.x; view.oy += q.y - drag.last.y; drag.last = q; draw(); return; }
  const p = pos(e), r = (e.pointerType === 'mouse' ? 11 : 20) / view.s;
  if (!drag) {
    if (e.pointerType !== 'mouse') return;
    if (refShape && tool !== 'int') { ghostAt = p; cv.style.cursor = 'crosshair'; draw(); return; }
    const h = hitProtHandle(p, r);
    let nh = null;
    if (!h && (tool === 'move' || tool === 'del' || tool === 'par' || tool === 'perp' || tool === 'int')) {
      const q = tool === 'move' ? (hitPoint(p, r) || hitLabel(p)) : null;
      const lo = tool === 'par' || tool === 'perp', hs = hitShape(p, r, lo);
      nh = q ? { pt:q } : (hs ? { shape:hs } : null);
    }
    cv.style.cursor = h ? (h === 'rot' ? 'grab' : h === 'size' ? 'ew-resize' : 'move')
      : tool === 'move' ? (nh ? 'grab' : inProt(p) ? 'move' : 'default') : (tool === 'del' || tool === 'par' || tool === 'perp' || tool === 'int') ? (nh || (tool === 'int' && hitIntersection(p, r)) ? 'pointer' : 'default') : 'crosshair';
    const key = o => o ? (o.pt || o.shape) : null;
    if (key(nh) !== key(hover)) { hover = nh; draw(); }
    return;
  }
  if (drag.kind === 'place') { drag.at = p; }
  else if (drag.kind === 'draw') {
    const pd = drag.type === 'circ' ? null : protDegreeSnap(drag.a, p);
    if (pd) { drag.b = { x:pd.x, y:pd.y }; drag.liveDeg = pd.deg; }
    else { const sp = snap(p, r, drag.a); drag.b = { x:sp.x, y:sp.y }; drag.bPt = sp.pt || null; drag.liveDeg = null; }
    if (pd) drag.bPt = null;
  } else if (drag.kind === 'pt') {
    if (!drag.moved) { const q = spos(e); if (dist(q, drag.start) < 6) return; drag.moved = true; }
    if (drag.pt.dep) return;   // kesişim noktası şekillere bağlıdır, tek başına taşınmaz
    const sp = snap(p, r, drag.pt); drag.pt.x = sp.x; drag.pt.y = sp.y;
  } else if (drag.kind === 'shape') {
    const dx = p.x - drag.last.x, dy = p.y - drag.last.y;
    for (const q of new Set([drag.s.a, drag.s.b])) if (!q.dep) { q.x += dx; q.y += dy; }
    drag.last = p;
  } else if (drag.kind === 'prot-move') {
    const c = { x:p.x + drag.off.x, y:p.y + drag.off.y };
    let best = null, bd = 14 / view.s;
    for (const q of [...allPoints(), ...computeAngles().clusters]) { const d = dist(c, q); if (d < bd) { bd = d; best = q; } }
    prot.x = best ? best.x : c.x; prot.y = best ? best.y : c.y;
  } else if (drag.kind === 'prot-rot') {
    let a = Math.atan2(p.y - prot.y, p.x - prot.x) + Math.PI / 2;
    const cands = [];
    for (let k = 0; k < 24; k++) cands.push(k * Math.PI / 12);
    for (const s of shapes) if (!isCirc(s) && distToShape(prot, s) < 1.5) { const d = sub(s.b, s.a), t = Math.atan2(d.y, d.x); cands.push(t, t + Math.PI); }
    const tol = 3 * Math.PI / 180;
    for (const c of cands) { let df = Math.atan2(Math.sin(a - c), Math.cos(a - c)); if (Math.abs(df) < tol) { a = c; break; } }
    prot.rot = a;
  } else if (drag.kind === 'prot-size') {
    prot.r = Math.max(90, Math.min(Math.min(W, H) * 0.9 / view.s, dist(p, prot) - 22));
  }
  draw();
});

function endDrag(e){
  if (!drag) return;
  if (drag.kind === 'draw') {
    if (dist(drag.a, drag.b) > 14) {
      pushHist();
      const a = drag.aExisting ? drag.a : newPoint(drag.a.x, drag.a.y);
      let b = drag.bPt && drag.bPt !== a ? drag.bPt : newPoint(drag.b.x, drag.b.y);
      shapes.push({ type:drag.type, a, b });
    }
  } else if (drag.kind === 'place') {
    const g = buildRel(refShape, drag.at, (e && e.pointerType === 'mouse' ? 11 : 20) / view.s);
    if (dist(g.a, g.b) > 4) {
      pushHist();
      const a = g.aPt || newPoint(g.a.x, g.a.y), b = g.bPt && g.bPt !== a ? g.bPt : newPoint(g.b.x, g.b.y);
      shapes.push({ type:g.type, a, b });
    }
    refShape = null; ghostAt = null; hintEl.textContent = HINTS[tool];
  } else if (drag.kind === 'pt' && !drag.moved) {
    history.pop(); const q = drag.pt; drag = null; startRename(q); draw(); return;
  } else if (drag.kind === 'pt') {
    // nokta başka bir noktanın üzerine bırakıldıysa birleştir
    const t = allPoints().find(q => q !== drag.pt && dist(q, drag.pt) < 1);
    if (t) for (const s of shapes) { if (s.a === drag.pt) s.a = t; if (s.b === drag.pt) s.b = t; }
    shapes = shapes.filter(s => s.a !== s.b);
  }
  drag = null; draw();
}
function onUp(e){
  touches.delete(e.pointerId);
  if (pinch) { if (touches.size < 2) pinch = null; return; }
  if (drag && drag.kind === 'pan') { drag = null; cv.style.cursor = tool === 'move' ? 'default' : cv.style.cursor; return; }
  endDrag(e);
}
cv.addEventListener('pointerup', onUp);
cv.addEventListener('pointercancel', onUp);
cv.addEventListener('auxclick', e => e.preventDefault());
cv.addEventListener('pointerleave', e => { if (!drag && (hover || ghostAt)) { hover = null; ghostAt = null; draw(); } });

/* ---------- Ad değiştirme ---------- */
const renameEl = document.getElementById('rename'); let renaming = null;
function startRename(pt){
  renaming = pt;
  const sx = pt.x * view.s + view.ox, sy = pt.y * view.s + view.oy;
  renameEl.style.left = Math.max(4, Math.min(W - 68, sx + 6)) + 'px';
  renameEl.style.top = Math.max(4, Math.min(H - 38, sy - 44)) + 'px';
  renameEl.value = pt.name; renameEl.hidden = false; renameEl.focus(); renameEl.select();
}
function finishRename(save){
  if (!renaming) return;
  const pt = renaming, v = renameEl.value.trim(); renaming = null; renameEl.hidden = true;
  if (!save || !v || v === pt.name) { draw(); return; }
  if (allPoints().some(q => q !== pt && q.name === v)) { toast('“' + esc(v) + '” adı başka bir noktada kullanılıyor.'); draw(); return; }
  pushHist(); pt.name = v; draw();
}
renameEl.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); finishRename(true); } else if (e.key === 'Escape') finishRename(false); });
renameEl.addEventListener('blur', () => finishRename(true));
cv.addEventListener('dblclick', e => { const p = pos(e), q = hitPoint(p, 11 / view.s) || hitLabel(p); if (q) { drag = null; startRename(q); } });

/* ---------- Menü ---------- */
const hintEl = document.getElementById('hint');
function setTool(t){
  finishRename(true); tool = t; hover = null; refShape = null; ghostAt = null;
  document.querySelectorAll('[data-tool]').forEach(b => b.classList.toggle('on', b.dataset.tool === t));
  hintEl.textContent = HINTS[t] + (prot.on && ['ray','seg','line'].includes(t) ? ' Açıölçerin merkezinden başlarsanız tam derece ile çizilir.' : '');
  cv.style.cursor = ['ray','seg','line'].includes(t) ? 'crosshair' : 'default';
  draw();
}
document.querySelectorAll('[data-tool]').forEach(b => b.addEventListener('click', () => setTool(b.dataset.tool)));
document.getElementById('b-undo').addEventListener('click', undo);

const clearBtn = document.getElementById('b-clear'); let clearTimer = null;
clearBtn.addEventListener('click', () => {
  if (!clearBtn.classList.contains('armed')) {
    clearBtn.classList.add('armed'); clearBtn.querySelector('span').textContent = 'Emin misiniz?';
    clearTimeout(clearTimer); clearTimer = setTimeout(resetClear, 3000); return;
  }
  resetClear(); refShape = null; if (shapes.length) { pushHist(); shapes = []; marks = []; letterIdx = 0; draw(); }
});
function resetClear(){ clearBtn.classList.remove('armed'); clearBtn.querySelector('span').textContent = 'Temizle'; }

const degBtn = document.getElementById('b-deg');
degBtn.addEventListener('click', () => {
  showDeg = !showDeg;
  degBtn.querySelector('span').textContent = showDeg ? 'Dereceleri Gizle' : 'Dereceleri Göster';
  document.getElementById('deg-slash').setAttribute('opacity', showDeg ? '0' : '1');
  degBtn.classList.toggle('on', !showDeg); draw();
});
const protBtn = document.getElementById('b-prot');
protBtn.addEventListener('click', () => {
  prot.on = !prot.on;
  if (prot.on && !prot.placed) { prot.x = (W / 2 - view.ox) / view.s; prot.y = (H * 0.68 - view.oy) / view.s; prot.r = Math.max(110, Math.min(190, Math.min(W, H) * 0.32)) / view.s; prot.rot = 0; prot.placed = true; }
  protBtn.classList.toggle('on', prot.on); setTool(tool);
});

/* ---------- Güncelleme ---------- */
const toastEl = document.getElementById('toast'); let toastTimer;
const esc = t => String(t).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c]);
function toast(html, ms = 3200){ toastEl.innerHTML = html; toastEl.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.hidden = true, ms); }
const isApk = () => !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
const newer = (a, b) => { const x = a.split('.').map(Number), y = b.split('.').map(Number); for (let i = 0; i < 3; i++) { if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0); } return false; };
document.getElementById('b-update').addEventListener('click', async () => {
  toast('Güncelleme kontrol ediliyor…');
  try {
    const base = location.hostname.endsWith('github.io') ? './' : PAGES_URL;
    const res = await fetch(base + 'version.json?t=' + Date.now(), { cache:'no-store' });
    if (!res.ok) throw new Error();
    const v = await res.json();
    if (!newer(v.version, APP_VERSION)) { toast('Uygulama güncel ✓'); return; }
    // APK, uygulamayı GitHub Pages'ten açar; yeni APK indirmeye gerek yok, sayfayı yeni sürümle yeniden yüklemek yeterli
    toast('Yeni sürüm yükleniyor…');
    try { if (window.caches) for (const k of await caches.keys()) await caches.delete(k); } catch (_) {}
    const fresh = '?v=' + Date.now();
    if (location.hostname.endsWith('github.io')) location.replace(location.pathname + fresh);
    else if (isApk()) location.replace(PAGES_URL + fresh);
    else window.open(PAGES_URL + fresh, '_blank');
  } catch (err) { toast('Şu anda güncellemeye ulaşılamıyor. İnternet bağlantınızı kontrol edip tekrar deneyin.', 4500); }
});

/* ---------- Başlangıç ---------- */
function resize(){
  const r = stage.getBoundingClientRect(); W = r.width; H = r.height; DPR = window.devicePixelRatio || 1;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); cv.style.width = W + 'px'; cv.style.height = H + 'px'; draw();
}
window.addEventListener('resize', resize);
resize();
// Örnek: kesişen iki doğru (ters açılar aynı renkte görünür)
(function seed(){
  const cx = W / 2, cy = H / 2, k = Math.min(W, H) * 0.28;
  shapes.push({ type:'line', a:newPoint(cx - k, cy + k * 0.35), b:newPoint(cx + k, cy - k * 0.35) });
  shapes.push({ type:'line', a:newPoint(cx - k * 0.45, cy - k), b:newPoint(cx + k * 0.45, cy + k) });
})();
setTool('ray');
if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
